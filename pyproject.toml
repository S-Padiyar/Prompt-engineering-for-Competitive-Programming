[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "ai-gen-solutions"

[[tool.mypy.overrides]]
module = ["pandas", "statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "pyperclip", "requests", "requests.*", "selenium.*"]
follow_imports = "skip"
ignore_missing_imports = true
